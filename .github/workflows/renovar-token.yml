name: Verificar y renovar token Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

jobs:
  token:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
    steps:
      - name: 1 - Token valido (/me)
        run: |
          code=$(curl -s -o me.json -w "%{http_code}" "https://graph.instagram.com/me?fields=user_id,username&access_token=$IG_TOKEN")
          echo "HTTP $code"; python3 -c "import json;d=json.load(open('me.json'));d.pop('access_token',None);print(d)"
          test "$code" = "200"
      - name: 2 - Renovar (refresh) y comparar
        run: |
          code=$(curl -s -o r.json -w "%{http_code}" "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          echo "HTTP $code"
          python3 - <<'PY'
          import json, os
          d = json.load(open("r.json"))
          print("expires_in:", d.get("expires_in"), "error:", d.get("error"))
          nuevo = d.get("access_token", "")
          assert nuevo, "sin token en la respuesta"
          assert nuevo == os.environ["IG_TOKEN"].strip(), "token DISTINTO: actualizar secret IG_TOKEN"
          print("OK: mismo token, vigencia extendida")
          PY
