name: Publicar diario Yala

on:
  schedule:
    # 22:00 UTC = 17:00 Bogotá. GitHub retrasa los cron ~2-3 h, así que sale ~19-20h Bogotá.
    # 7 días/semana (decisión de Andrés, 30-ago-2026 — ya no se salta domingo).
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      fecha_forzada:
        description: 'Forzar una fecha (YYYY-MM-DD) para probar, en vez de usar hoy'
        required: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar el post de hoy (si hay uno pendiente)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FECHA_FORZADA: ${{ inputs.fecha_forzada }}
        run: python3 publicar_cola.py

      - name: Commitear la cola actualizada
        run: |
          git config user.name "yala-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cola.json
          git diff --cached --quiet || git commit -m "cola: marcar publicado ($(date -u +%F))"
          git push
